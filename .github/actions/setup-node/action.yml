name: Setup Node.js and pnpm
description: Sets up Node.js and pnpm with caching
inputs:
  install-deps:
    description: Whether to install dependencies with pnpm
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        cache: true
        runtime: node@24.21.0
        install: ${{ inputs.install-deps }}
