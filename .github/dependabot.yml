version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "00:00"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "00:00"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "00:00"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 7
